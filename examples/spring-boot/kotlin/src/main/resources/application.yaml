server:
  # Loopback only: the endpoints are unauthenticated, and every request calls the model.
  address: localhost

adk:
  # Any Gemini model works, such as gemini-3.8-flash.
  model: gemini-4-argon
  vertex:
    # With a project, calls Vertex AI; without one, calls the Gemini API with GOOGLE_API_KEY.
    project: ${GOOGLE_CLOUD_PROJECT:}
    location: ${GOOGLE_CLOUD_LOCATION:global}
